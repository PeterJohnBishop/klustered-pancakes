apiVersion: apps/v1
kind: Deployment
metadata:
  name: klustered-pancakes-deployment
  labels:
    app: klustered-pancakes-app
spec:
  replicas: 5
  selector:
    matchLabels:
      app: klustered-pancakes-app
  template:
    metadata:
      labels:
        app: klustered-pancakes-app
    spec:
      containers:
        - name: gin-server
          image: peterjbishop/klustered-pancakes:v1
          imagePullPolicy: Never # <-- Crucial: Forces K8s to use the side-loaded cache
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: klustered-pancakes-app-service
spec:
  type: NodePort
  selector:
    app: klustered-pancakes-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
